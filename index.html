        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #2a7fff;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #2a7fff;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #d8e5f8;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

                               padding:24px 22px 22px !important; max-width:none !important; margin:0 !important; }
            .staticrypt-instructions { margin-bottom:14px !important; }
            .staticrypt-title { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
            .staticrypt-instructions p { color:#5d6b82 !important; font-size:15px !important; margin:0 !important; text-align:center; }
            .staticrypt-hr { display:none !important; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                background:#f1f6fd !important; border:1.5px solid #cddcf2 !important; border-radius:12px !important;
                height:48px !important; padding:0 44px 0 14px !important; font-size:16px !important; color:#142033 !important; box-sizing:border-box; }
            .staticrypt-form input[type="password"]:focus, .staticrypt-form input[type="text"]:focus { outline:none; border-color:#2a7fff !important; }
            .staticrypt-toggle-password-visibility { opacity:.45; }
            label.staticrypt-remember { color:#5d6b82 !important; font-size:14.5px !important; display:flex !important; align-items:center; gap:8px; margin:12px 0 4px !important; }
            label.staticrypt-remember.hidden { display:none !important; }
            .staticrypt-remember input[type="checkbox"] { accent-color:#2a7fff; width:20px; height:20px; margin:0 !important; transform:none !important; flex:0 0 auto; }
            .staticrypt-password-container { background:transparent !important; margin:0 !important; border-radius:12px; }
            .staticrypt-form .staticrypt-decrypt-button, .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus, .staticrypt-form .staticrypt-decrypt-button:active {
                background:#2a7fff !important; color:#fff !important; border:0 !important; border-radius:12px !important; height:48px;
                font-size:16px !important; font-weight:700 !important; letter-spacing:.02em; text-transform:none !important; margin-top:12px !important;
                box-shadow:0 6px 16px rgba(42,127,255,.28); cursor:pointer; }
            .staticrypt-form .staticrypt-decrypt-button:active { transform:translateY(1px); }
